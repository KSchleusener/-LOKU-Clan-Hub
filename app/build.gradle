plugins { id 'com.android.application' }
android {
    namespace 'de.loku.clanhub'
    compileSdk 35
    defaultConfig {
        // Eigenstaendige Installation neben der vorhandenen LOKU-App
        applicationId 'de.loku.eventclicker.petsrecorder2026'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.3.0-pets-macros-test'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

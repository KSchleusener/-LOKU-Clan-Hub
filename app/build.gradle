plugins { id 'com.android.application' }
android {
    namespace 'de.loku.clanhub'
    compileSdk 35
    defaultConfig {
        // Eigenstaendige Installation neben der vorhandenen LOKU-App
        applicationId 'de.loku.eventclicker.standalone'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.1.2-android35-test'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

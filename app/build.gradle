plugins { id 'com.android.application' }
android {
    namespace 'de.loku.clanhub'
    compileSdk 35
    defaultConfig {
        // Eigene App-ID verhindert einen Signatur-Konflikt mit der bestehenden LOKU-App.
        applicationId 'de.loku.eventclicker.standalone'
        minSdk 26
        targetSdk 32
        versionCode 2
        versionName '0.1.1-test'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
